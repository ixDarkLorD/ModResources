name: Maven site
# Publishes the Maven on GitHub Pages at ixdarklord.github.io/ModResources: the maven/ folder, a page for every folder in
# it, and a front page with the repository to add and each artifact's versions (.github/site/build.py). It runs on every
# push that changes the Maven, so a release the mods' workflows publish is on the site a minute later.
on:
  push:
    branches: [main]
    paths: [maven/**, .github/site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/site/build.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
